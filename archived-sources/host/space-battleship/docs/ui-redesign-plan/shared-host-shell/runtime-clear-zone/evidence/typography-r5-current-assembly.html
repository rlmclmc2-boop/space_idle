<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>7c 装备与 B01 共享画面 R5</title><style>@font-face{font-family:SC;src:url('../../../../../assets/fonts/NotoSansSC.ttf')}*{box-sizing:border-box}body{margin:0;background:#091b29;color:#e7efea;font:15px SC,sans-serif}header{padding:20px 30px;background:#133643}h1{font-size:23px;margin:0 0 5px}p{margin:0;line-height:1.55;color:#c8d9d7}nav{display:flex;flex-wrap:wrap;gap:7px;padding:14px 30px}button{font:15px SC,sans-serif;color:#e5eae5;background:#214653;border:1px solid #6c9292;padding:7px 13px;cursor:pointer}button[aria-selected=true]{color:#183746;background:#ebd6aa}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 30px}.panel h2{font-size:17px;margin:0 0 7px}.panel img{display:block;width:100%;border:1px solid #68898d}.panel a{display:block;color:#e0e7dc;font-size:13px;margin-top:6px}.note{margin:17px 30px 26px;line-height:1.6;font-size:14px;color:#d6e3db}b{color:#f3d29a}.tag{display:inline-block;background:#244d5b;padding:4px 8px;font-size:15px}</style><header><h1>7c 装备整页 × B01 公共视觉对照 R5 <span class="tag">进行中 · 非最终实机</span></h1><p>装备七态左图是原组 7c 固定静态设计，右图仅把米色公共占位顶带替换为现行游戏公共装备顶带，模块 x0–808/y85–900 及战场逐像素保留。反应堆左图是真实四路均分组合，右图仅示舞台背景原层左右收口方向。</p></header><nav id="tabs"></nav><div class="pair"><section class="panel"><h2 id="left-title"></h2><img id="left"><a id="left-link">原尺寸左图</a></section><section class="panel"><h2 id="right-title"></h2><img id="right"><a id="right-link">原尺寸右图</a></section></div><p class="note" id="note"></p><script>
const gear={'01':'早2','02':'中5','03':'晚8','04':'同槽下拉','05':'可购/不足','06':'换装接纳','07':'按需比较'};const data={};for(const [k,n] of Object.entries(gear))data[k]={name:`装备 ${n}`,left:`typography-r5-equipment-${k}-source.png`,right:`typography-r5-equipment-${k}-combo.png`,note:`<b>装备 ${n}：</b>7c 原组已重新排了整页槽容器、行节奏、名称入口、状态与两键，当前原审中；本组只接公共顶带以看真实跨页关系，工作台材质/机库背景仍由原装备组在其固定源继续适配。右图的余额来自旧公共实机，仅作字色与构图参照，不是本静态样例的同一业务存档。`};data.reactor={name:'反应堆四路均分',left:'eea-combo-reactor-max-1440x900.png',right:'typography-r4-reactor-edge.png',note:'<b>B01：</b>左图为已固定组合的四路25%均分实际画面；右图把舞台背景两侧在原图层内向宿主暗色收口，仅是边界设计预览，不是新框或运行改动。1/2/3路真实解锁图及最终均分全状态仍等反应堆原组固定，不能借四路外推。'};data.planet={name:'星球公共关系',left:'eea-combo-planet-1440x900.png',right:'eea-combo-planet-1440x900.png',note:'<b>星球：</b>保持公共顶带和导航对照；现 ac5 内景已被用户品质退回，不在此稿代改。'};let tabs=document.getElementById('tabs');for(const [k,d] of Object.entries(data)){let b=document.createElement('button');b.dataset.key=k;b.textContent=d.name;b.onclick=()=>show(k);tabs.append(b)}function show(k){let d=data[k];for(let b of tabs.children)b.setAttribute('aria-selected',b.dataset.key===k);document.getElementById('left').src=d.left;document.getElementById('right').src=d.right;document.getElementById('left-link').href=d.left;document.getElementById('right-link').href=d.right;document.getElementById('left-title').textContent=k==='reactor'?'现行组合 · 真实四路均分':'原组固定静态原图';document.getElementById('right-title').textContent=k==='reactor'?'现有舞台边界设计预览':'公共顶带接入设计预览';document.getElementById('note').innerHTML=d.note}show('03');</script></html>
