<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__UI_title__</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#18283d;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:25px 32px 18px;background:#142b41;color:white}h1{font-size:26px;margin:0 0 8px}p{margin:0;color:#c1d2e4}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;padding:16px 32px;background:#fff;border-bottom:1px solid #d9e1e9}input,select,button{font:inherit;border:1px solid #b9c8d7;border-radius:6px;padding:9px 14px}input{width:340px}button{background:#135e81;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}#count{margin-left:auto;color:#52687a}#status{white-space:pre-wrap;padding:12px 32px;color:#12614b}#status.error{color:#ac2834}main{padding:0 24px 32px}table{width:100%;table-layout:fixed;border-collapse:collapse;background:white}th{text-align:left;background:#e7edf4;padding:12px}td{padding:14px 12px;vertical-align:top;border-bottom:1px solid #e4eaf0}th:nth-child(1){width:22%}th:nth-child(2){width:44%}th:nth-child(3){width:18%}th:nth-child(4){width:16%}.key{overflow-wrap:anywhere;font:12px/1.8 Consolas,monospace;color:#506176}.category{font-size:13px;color:#527086}.note{font-size:12px;overflow-wrap:anywhere;color:#697a8b}textarea{width:100%;min-height:72px;resize:vertical;font:15px/1.65 "Microsoft YaHei",sans-serif;border:1px solid #bacad8;border-radius:5px;padding:9px;background:#fbfdff}textarea:focus{outline:2px solid #3896b7}.chip{display:inline-block;padding:2px 7px;background:#ddf1f7;color:#075577;border-radius:4px;margin:0 4px 5px 0;font:12px/1.8 Consolas,monospace}.invalid textarea{border:2px solid #bc3748}.err{color:#ac2834;font-size:13px}.preview{white-space:pre-wrap;margin-top:5px;color:#5c7182;font-size:13px;overflow-wrap:anywhere}.changed{box-shadow:inset 3px 0 #258eaa}@media(max-width:900px){.toolbar{flex-wrap:wrap;padding:12px}main{padding:0 8px}th:nth-child(1){width:22%}th:nth-child(2){width:45%}td{padding:8px}input{width:240px}}
</style>
<header><h1>__UI_title__</h1><p>__UI_intro__</p></header>
<div class="toolbar"><input id="search" aria-label="__UI_search__" placeholder="__UI_search_placeholder__"><select id="category" aria-label="__UI_category__"><option value="">__UI_all__</option></select><select id="visibility" aria-label="__UI_visibility__"><option value="active">__UI_active__</option><option value="deleted">__UI_deleted__</option></select><button id="save" disabled>__UI_save__</button><span id="count"></span></div>
<div id="status" role="status">__UI_loading__</div>
<main><table><thead><tr><th>__UI_key_header__</th><th>__UI_text_header__</th><th>__UI_params_header__</th><th>__UI_note_header__</th></tr></thead><tbody id="body"></tbody></table></main>
<script>
'use strict';
const labels=__LABELS__, t=(key,values={})=>labels[key].replace(/\{([^{}]+)\}/g,(_,name)=>String(values[name]));
const token='__TOKEN__', $=id=>document.getElementById(id), headers={'X-UI-Token':token,'Content-Type':'application/json'};
let rows=[],revision='',original={},busy=false;
const names=__CATEGORIES__;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function issues(row){const required=row.params.match(/\{[^{}]*\}/g)||[],actual=row.text.match(/\{[^{}]*\}/g)||[],missing=[...required];const extra=[];for(const p of actual){const i=missing.indexOf(p);if(i<0)extra.push(p);else missing.splice(i,1)}const errors=[];if(missing.length)errors.push(t('missing',{parameters:missing.join('、')}));if(extra.length)errors.push(t('extra',{parameters:extra.join('、')}));if(/[{}]/.test(row.text.replace(/\{[^{}]*\}/g,'')))errors.push(t('braces'));return errors}
function preview(container,text){container.replaceChildren();for(const part of text.split(/(\{[^{}]*\})/g)){container.append(node('span',part,part.startsWith('{')?'chip':''))}}
function update(){const dirty=rows.filter(r=>r.text!==original[r.key]).length,invalid=rows.filter(r=>issues(r).length).length;document.querySelectorAll('textarea').forEach(e=>e.readOnly=busy);document.querySelectorAll('[data-row-action]').forEach(b=>b.disabled=busy);$('save').disabled=busy||!dirty||!!invalid;$('count').textContent=t('count',{total:rows.filter(r=>!r.deleted).length,dirty,invalid:invalid?t('invalid_count',{count:invalid}):''})}
function render(){const q=$('search').value.toLowerCase(),cat=$('category').value;$('body').replaceChildren();for(const row of rows){if(!!row.deleted!==($('visibility').value==='deleted'))continue;if(cat&&row.category!==cat)continue;if(q&&!`${row.key} ${row.text} ${row.note}`.toLowerCase().includes(q))continue;const tr=node('tr'),id=node('td'),text=node('td'),param=node('td'),note=node('td',row.note,'note');id.append(node('div',row.key,'key'),node('div',names[row.category]||row.category,'category'));const input=node('textarea');input.value=row.text;input.disabled=!!row.deleted;input.setAttribute('aria-label',row.key);input.spellcheck=false;const error=node('div','','err'),view=node('div','','preview');text.append(input,error,view);for(const p of row.params.match(/\{[^{}]*\}/g)||[])param.append(node('span',p,'chip'));if(!row.params)param.append(node('span','—'));function refresh(){const errors=issues(row);tr.classList.toggle('invalid',!!errors.length);tr.classList.toggle('changed',row.text!==original[row.key]);error.textContent=errors.join('；');preview(view,row.text)}input.oninput=()=>{row.text=input.value;refresh();update()};refresh();const action=node('button',t(row.deleted?'restore':'delete'));action.dataset.rowAction='true';action.onclick=()=>changeDeleted(row,tr);note.append(node('br'),action);tr.append(id,text,param,note);$('body').append(tr)}update()}
$('search').oninput=render;$('category').onchange=render;$('visibility').onchange=render;
async function changeDeleted(row,tr){if(busy)return;busy=true;update();try{const response=await fetch('/deleted',{method:'POST',headers,body:JSON.stringify({revision,key:row.key,deleted:!row.deleted})});const result=await response.json();if(!response.ok)throw Error(result.error);revision=result.revision;row.deleted=!row.deleted;row.text=original[row.key];tr.remove();$('status').textContent=result.message;$('status').className=''}catch(e){$('status').textContent=e.message;$('status').className='error'}finally{busy=false;update()}}
$('save').onclick=async()=>{if(rows.some(r=>issues(r).length))return;busy=true;update();try{const response=await fetch('/save',{method:'POST',headers,body:JSON.stringify({revision,texts:Object.fromEntries(rows.map(r=>[r.key,r.text]))})});const result=await response.json();if(!response.ok)throw Error(result.error);revision=result.revision;original=Object.fromEntries(rows.map(r=>[r.key,r.text]));$('status').textContent=result.message;$('status').className='';render()}catch(e){$('status').textContent=e.message;$('status').className='error'}finally{busy=false;update()}};
window.addEventListener('beforeunload',e=>{if(rows.some(r=>r.text!==original[r.key])){e.preventDefault();e.returnValue=''}});
(async()=>{try{const response=await fetch('/catalog',{headers});if(!response.ok)throw Error(t('load_failed'));const result=await response.json();rows=result.rows;revision=result.revision;original=Object.fromEntries(rows.map(r=>[r.key,r.text]));for(const [key,name] of Object.entries(names)){const option=node('option',name);option.value=key;$('category').append(option)}$('status').textContent=result.errors.length?result.errors.join('\n'):t('ready');$('status').className=result.errors.length?'error':'';render()}catch(e){$('status').textContent=e.message;$('status').className='error'}})();
</script></html>
