<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>太空战舰 · 桌面结构修订03</title>
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <div class="viewport-notice">本轮仅评审桌面宽屏，候选最小宽度1200。<br>窄屏适配与专项检查已排除；未来恢复须用户另行明确。</div>
  <div class="app" id="app">
    <header class="global">
      <strong class="brand">◈ 太空战舰</strong>
      <div class="wallet"><span>铁 <b>2.48M</b></span><span>铀 <b>8.62K</b></span><span>强化碎片 <b>1.37K</b></span></div>
      <button id="archive">档案</button><button id="settings">设置</button>
    </header>
    <main class="work">
      <section class="battle" aria-label="持续战场固定示例">
        <header><strong>第7关 · 战点4</strong><span id="battle-state">交战中 · 2 / 3 波</span></header>
        <div class="battle-space"><div class="battle-map">
          <img class="enemy e1" alt="" src="../../assets/ships/enemy/fleet_20261019/scout.png">
          <img class="enemy e2" alt="" src="../../assets/ships/enemy/fleet_20261019/anchor.png">
          <img class="enemy e3" alt="" src="../../assets/ships/enemy/fleet_20261019/scout.png">
          <div class="beam"></div>
          <img class="player" alt="巡洋舰示意" src="../../assets/ships/fleet_20261019/player/03-cruiser.png">
        </div></div>
        <div class="battle-hud">
          <div class="split"><span>护盾</span><b>8.16K / 12.0K</b></div><div class="track"><i></i></div>
          <div class="split"><span>装甲</span><b>6.96K / 8.0K</b></div><div class="track armour"><i></i></div>
          <div class="battle-actions"><button id="pause">暂停</button><button id="guard">驻守：关闭</button><button id="battle-detail">战况</button></div>
        </div>
      </section>
      <section class="module" aria-label="当前舱室">
        <nav id="nav" aria-label="舱室导航"></nav>
        <div class="module-title"><div><span class="eyebrow" id="caption"></span><h1 id="title"></h1></div><div id="context-tools"></div><button id="collapse">收起舱室</button></div>
        <div class="module-body" id="module-body"></div>
      </section>
    </main>
    <footer class="review-bar"><span>结构修订03 · 待审 · 所有数值/回执均为固定示例 · 未连接游戏 · 美术未定</span><label>审阅场景 <select id="scenario" aria-label="切换审阅场景"></select></label></footer>
  </div>
  <div class="dialog" id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-content"><h2 id="dialog-title"></h2><div id="dialog-body"></div><button id="close-dialog">关闭</button></div></div>
  <script src="desktop.js"></script>
</body>
</html>
