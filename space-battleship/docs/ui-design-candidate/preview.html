function research(){return `<div class="split" style="margin-bottom:12px"><span class="status">研究中</span><button id="choose-research">更换研究</button></div><div class="scene"><img class="factory-bg" src="../../assets/ai_tech_factory/workshop-background-v2.png"><img class="machine" src="../../assets/ai_tech_factory/weapon-accuracy-v2.png"><img class="probe" src="../../assets/ai_tech_factory/inspection-probe-v2.png"><span class="scene-label">武器精准 · Lv. 12</span></div><div class="research-readout"><div class="main"><div class="split"><h2>下一等级效果 +6%</h2><span class="small">62%</span></div><div class="progress"><i></i></div><p class="small muted" style="margin-top:6px">剩余 38 秒 · 速度 1.24K 工作量/秒</p></div><span class="status">续研岗 1 人</span></div><div class="research-console"><div><label for="iron">铁投入 / 秒 · 草稿</label><input id="iron" value="120"><p class="small muted">当前生效：100 / 秒</p></div><div><label for="uranium">铀投入 / 秒 · 草稿</label><input id="uranium" value="2"><p class="small muted">当前生效：2 / 秒</p></div><div class="actions"><span id="draft-state">编辑中 · 尚未应用</span><button id="reset-research">还原</button><button id="apply-research" class="primary">应用投入</button></div><div style="grid-column:1/-1" class="small muted">自动投入：关闭 · 岗位续研：开启 <button class="quiet" id="auto-detail">设置</button></div></div><p class="module-note"><span class="draft">待审</span> 首代工厂资源用于构图试装，设备映射/透视待核。当前稿无前置未满足研究占位。</p>`}
function equipment(){return `<div class="ship-stage"><img src="../../assets/ui/ships/fleet_20261019/03-cruiser.png"><span class="scene-label">当前舰 · 巡洋舰</span></div><div class="split" style="padding:12px 0"><span class="small">武器槽 3 · 防御槽 2</span><button data-demo="换舰层先展示候选与槽位启用变化，提交前保持当前舰。">选择舰体</button></div><div class="slot-list">${[['武器 01 · 舰炮','Lv. 19 · 单次伤害 12.6K','购买 1 级 · 2.4K 铁'],['防御 01 · 复合装甲','Lv. 18 · 最大容量 8.0K','查看 / 更换']].map(([name,info,action])=>`<div class="slot"><img src="../../assets/ui/shell/equipment.svg"><div><h3>${name}</h3><p>${info}</p></div><button data-demo="所选槽位详情：现装与候选同口径比较，费用与冷却显示业务输出。首防御槽不提供卸空动作。">${action}</button></div>`).join('')}</div><p class="module-note"><span class="draft">待审</span> 舰体预览不代表战斗尺度；此稿展示单槽操作，批量/MAX 放入装备组操作区，费用引用真实报价。</p>`}
const outlines={enhancement:['效果顺位台','按武器/防御分组的顺位轨道占据主区；当前效果、分支和已选路径围绕所选节点展开。','购买 1 级 / 最多购买 10 级；移动顺位；选择分支。无强化 MAX。'],crew:['任务值班舱','人物名册与实际任务构成主区。窄窗用名册→人物详情，详情保留姓名、等级/经验和实际占用。','派遣草稿与当前岗位并列，确认/释放作用于一名船员。无付费升级。'],planet:['轨道探索站','已接入球体与轨道设施是主体。设施详情跟随选中对象；探索队状态在近侧控制台。','探索/自动；本次完成后停止与立即取消分开；设施 ready 后才领取。'],galaxy:['星系城市图','现有 galaxy_map 占主区，顶部仅区域/人数，底部选中节点详情；不另画替代城市。','平移、缩放、选择节点；人员通过船员公开操作调整。建设自动完成，无领取按钮。'],hyperspace:['航路与无人机坞','四路线主轴与所选无人机构成主题；探索/仓库/改造/过滤为局部事务切换。','挑战与挂机分开；改造审阅费用/保护与范围；更换对象使预览失效。']};
function render(){if(!modules.some(m=>m[0]===active))active='reactor';const m=modules.find(m=>m[0]===active);$('#module-title').textContent=m[1];$('#module-caption').textContent=m[2];$('#nav').innerHTML=modules.map(([id,name])=>`<button data-module="${id}" class="${id===active?'active':''}" aria-current="${id===active?'page':'false'}">${name}</button>`).join('');$('#nav-select').innerHTML=modules.map(([id,name])=>`<option value="${id}" ${id===active?'selected':''}>${name}</option>`).join('');$('#module-body').innerHTML=active==='reactor'?reactor():active==='research'?research():active==='equipment'?equipment():`<div class="placeholder"><span class="draft">结构说明 · 尚无视觉细稿</span><h2>${outlines[active][0]}</h2><p>${outlines[active][1]}</p><p>${outlines[active][2]}</p><p class="muted small">本轮代表界面为反应炉、科研、舰装。此处仅用于核对导航，不代表该模块已经完成设计。</p></div>`;$('#module-body').scrollTop=0;bind();}
function select(id){active=id;app.classList.remove('collapsed');$('#compact-collapse').textContent='收起舱室';render();history.replaceState(null,'',`?module=${active}${query.get('narrow')==='half'?'&narrow=half':''}`)}
function collapse(){app.classList.toggle('collapsed');$('#compact-collapse').textContent=app.classList.contains('collapsed')?'展开舱室':'收起舱室'}
$('#nav-select').onchange=e=>select(e.target.value);$('#collapse').onclick=collapse;$('#compact-collapse').onclick=collapse;
function bind(){document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>select(b.dataset.module));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>openDialog('操作位置示意',`<p>${b.dataset.demo}</p><p class="muted small">此设计稿未连接游戏。</p>`));document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>{const input=document.querySelector(`[data-input="${b.dataset.id}"]`);input.value=String(Math.max(0,(Number(input.value)||0)+Number(b.dataset.adjust)));$('#power-feedback').textContent='编辑中 · 单设备提交后才更新已生效读数';});document.querySelectorAll('[data-input]').forEach(i=>i.oninput=()=>$('#power-feedback').textContent='编辑中 · 单设备提交后才更新已生效读数');document.querySelectorAll('[data-apply-id]').forEach(b=>b.onclick=()=>{const input=document.querySelector(`[data-input="${b.dataset.applyId}"]`);$('#power-feedback').textContent=!/^\d+$/.test(input.value)?'请输入非负整数；草稿已保留。':'该设备草稿待业务校验。本稿不提交，生效量未改变。'});$('#choose-research')?.addEventListener('click',()=>openDialog('已开放研究',`<p>武器精准 · 当前研究 · 已完成 62%</p><p>一体化 · 已完成 18%</p><p class="muted small">选择层结构示意。列表须来自现行可选项；未满足前置的研究不出现。</p>`));$('#reset-research')?.addEventListener('click',()=>{$('#iron').value='100';$('#uranium').value='2';$('#draft-state').textContent='已还原至当前设置'});$('#apply-research')?.addEventListener('click',()=>{$('#draft-state').textContent='草稿待业务校验 · 当前值未改变'});$('#auto-detail')?.addEventListener('click',()=>openDialog('自动投入与续研',`<p>自动投入：关闭。预算刷新时机在确认前展示。</p><p>岗位续研：开启，当前占用 1 人。</p><p class="small muted">自动投入比例与岗位操作分别提交，草稿不被收入刷新覆盖。</p>`));}
$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'恢复':'暂停';$('#battle-state').textContent=paused?'已暂停 · 第 2 / 3 波':'交战中 · 第 2 / 3 波'};$('#garrison').onclick=()=>{garrison=!garrison;$('#garrison').textContent='驻守：'+(garrison?'开启':'关闭')};$('#battle-detail').onclick=()=>openDialog('战况快照',`<p>护盾 8.16K / 12.0K · 装甲 6.96K / 8.0K</p><p>完整读数与临时效果在此按需显示。盾甲各自为零都不能单独表现为死亡。</p><p class="small muted">全稿为固定样例，不执行战斗。</p>`);$('#archive').onclick=()=>openDialog('档案入口',`<p>教程 / 敌方情报 / 通知</p><p class="small muted">已见与已读状态由原模块提供；主界面不重复教学。</p>`);$('#settings').onclick=()=>openDialog('系统设置位置',`<p>音画 / 保存目录与状态 / 导入与新游戏</p><p>当前设计尚未连接保存状态。真实保存失败须在全局资源栏下显示持续告警，跳转同一问题详情。</p><p class="small muted">危险事务另开对象预览与确认，不与普通选项混排。</p>`);render();
</script></html>
