<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>跨模块整页排版与接缝 R4</title><style>
@font-face{font-family:NotoProject;src:url('../../../../../assets/fonts/NotoSansSC.ttf')}*{box-sizing:border-box}body{margin:0;background:#091b2a;color:#eaf0eb;font:15px NotoProject,sans-serif}header{padding:20px 30px;background:#123541;border-bottom:1px solid #668b91}h1{font-size:23px;margin:0 0 6px}p{margin:0;line-height:1.55;color:#c4d7d4}nav{display:flex;flex-wrap:wrap;gap:7px;padding:15px 30px}button{font:15px NotoProject;color:#e6eee8;background:#214654;border:1px solid #6c9190;padding:7px 13px;cursor:pointer}button[aria-selected=true]{color:#1c3848;background:#ead7ac;border-color:#efdda9}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 30px}.panel{min-width:0}.panel h2{font-size:17px;margin:0 0 7px}.panel img{width:100%;display:block;border:1px solid #6b8d91}.panel a{font-size:13px;color:#d9e8df}.details{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:15px 30px}.detail{height:145px;border:1px solid #6b8d91;background-repeat:no-repeat;overflow:hidden}.note{margin:0 30px 25px;font-size:14px;color:#d8e7df}b{color:#f0d391}.badge{display:inline-block;background:#244d5a;padding:3px 8px;font-size:16px}
</style><header><h1>跨模块整页排版与可见背景 R4 <span class="badge">设计合成 · 非实机</span></h1><p>左侧为原组/当前组合固定整屏，右侧为同结构整页适配预览。装备早2、中5、晚8、下拉、05同高态都用同一版式规则；反应堆展示既有四路均分状态与舞台左右接续方向。业务和战斗投影不变。</p></header><nav id="tabs"></nav><main class="pair"><section class="panel"><h2 id="a-title"></h2><img id="a"><a id="a-link">原尺寸改前图</a></section><section class="panel"><h2 id="b-title"></h2><img id="b"><a id="b-link">原尺寸改后图</a></section></main><div class="details"><div id="a-detail" class="detail"></div><div id="b-detail" class="detail"></div></div><p class="note" id="note"></p><script>
const gear=(k,label,detail,note)=>({label,before:`typography-r4-equipment-${k}-before.png`,after:`typography-r4-equipment-${k}-after.png`,detail,note:`<b>装备${label}：</b>${note} 改后在原 ade5 逐槽 SVG 中保留舰体、场景、行高、8个下拉入口及两键；只把名称／主值／费用按真实字形和可见面边界组织，接入现行共享顶轨取代原静态米色占位。此图不是同一业务存档或 Godot 实机。`});
const data={early:gear('01','早2','-385px -365px','两条密集108px行保留完整费用和拒绝原因，早期工作台随启用槽收束。'),middle:gear('02','中5','-385px -350px','普通84px与密集108px行在同页，名称、主值、费用分别形成清楚阅读带。'),late:gear('03','晚8','-385px -260px','八槽最大密度；普通行名称下缘到主值、主值到费用、费用到底边按可见字形留净空。'),dropdown:gear('04','同槽下拉','-385px -690px','候选浮层仍由原名称入口展开，原槽与其他行不重排。'),afford:gear('05','05 同高状态','-385px -260px','普通行可购/不足同为84px，原因在原右上状态位，两键锚点不移动。'),reactor:{label:'B01 四路均分与左右接续',before:'eea-combo-reactor-max-1440x900.png',after:'typography-r4-reactor-edge.png',detail:'-0px -65px',note:'<b>反应堆：</b>左图为当前组合真实四路25%均分整屏；右图仅在既有舞台顶部区域的两侧做源层柔和收口预览，中央核心、下控制台、均分键、资源/导航与右战场原图不改。1/2/3路真实解锁状态待原组固定，不能由四路图外推；边缘预览非运行实装。'},planet:{label:'星球 · 公共关系边界',before:'eea-combo-planet-1440x900.png',after:'eea-combo-planet-1440x900.png',detail:'-0px -0px',note:'<b>星球：</b>只保留当前公共顶轨/导航关系作跨页对照，ac5主体已被用户品质退回，不在本轮代改其内部。'}};
const tabs=document.getElementById('tabs');for(const [key,val] of Object.entries(data)){const b=document.createElement('button');b.textContent=val.label;b.dataset.key=key;b.onclick=()=>show(key);tabs.append(b)}function show(k){let v=data[k];for(const b of tabs.children)b.setAttribute('aria-selected',b.dataset.key===k);document.getElementById('a-title').textContent=k==='reactor'?'当前组合实机 · 四路均分':'原组固定静态/当前组合原图';document.getElementById('b-title').textContent='整页适配设计预览 · 非实机';for(const [id,file] of [['a',v.before],['b',v.after]]){document.getElementById(id).src=file;document.getElementById(id+'-link').href=file;}for(const [id,file] of [['a-detail',v.before],['b-detail',v.after]]){const e=document.getElementById(id);e.style.backgroundImage=`url('${file}')`;e.style.backgroundPosition=v.detail;e.style.backgroundSize='1440px 900px'}document.getElementById('note').innerHTML=v.note}show('late');
</script></html>
