<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>H2顶部实际尺寸设计取证 · 非游戏实现</title><style>
@font-face{font-family:ShipSC;src:url('../../../assets/fonts/NotoSansSC.ttf') format('truetype');font-weight:100 900;font-display:block}*{box-sizing:border-box}html,body{margin:0;background:#081925;color:#ecebdc;font-family:ShipSC,sans-serif;font-weight:450;font-variation-settings:'wght' 450}body{width:1440px;padding:28px}h1{margin:0 0 8px;font-size:26px;font-weight:600}p{margin:4px 0 14px;font-size:16px;line-height:1.65;color:#bdd0cf}.case{margin-top:26px;display:grid;grid-template-columns:808px 1fr;gap:24px}.label{font-size:17px;margin:0 0 8px;color:#f5e5bf}.aside{padding-top:34px;font-size:16px;line-height:1.7;color:#a9c7c9}.bar{width:808px;height:65px;box-shadow:0 2px 0 #06111a;position:relative;isolation:isolate;background:#122f3c}.resources{display:grid;grid-template-columns:96px 160px 160px 208px 32px 88px;gap:8px;width:808px;height:32px;padding:0 12px;background:linear-gradient(#254655,#193845);border-top:1px solid #668c92;border-bottom:1px solid #518b8d;align-items:center}.brand{font-size:16px;font-weight:600;color:#f7ecd4;white-space:nowrap;letter-spacing:1px}.money{min-width:0;height:28px;display:flex;align-items:center;position:relative;border-left:1px solid #486c74;padding-left:7px}.money .amount{font-size:16px;line-height:24px;white-space:nowrap;color:#f1e5bc}.money .fallback{display:none;font-size:16px;line-height:24px;white-space:nowrap;color:#a7ece4}.money.overflow .amount{display:none}.money.overflow .fallback{display:block}.fullwallet{height:26px;width:32px;font:inherit;font-size:20px;line-height:20px;color:#b7dfdc;background:#173a47;border:1px solid #426670;border-radius:3px}.save{height:26px;font-size:16px;line-height:24px;text-align:center;border:1px solid #426670;background:#173a47;border-radius:3px;white-space:nowrap;color:#b8d3ca}.save.error{color:#ffce9f;background:#4e322c;border-color:#c58b5b}.nav{height:33px;display:flex;gap:4px;padding:1.5px 12px;background:linear-gradient(#193945,#102d3a);border-bottom:1px solid #5b9a9e}.nav button{height:30px;flex:none;padding:0 8px;border:1px solid transparent;border-right-color:#3c5c69;border-radius:3px;background:transparent;color:#dbe8e1;display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:16px;line-height:22px;white-space:nowrap}.nav button img{width:18px;height:18px;object-fit:contain;filter:none}.nav button.selected{color:#173c4a;background:linear-gradient(#fff5dc,#e5dfcb);border-color:#d0c4a3;box-shadow:inset 0 -2px #83cfcb}.nav button.selected img{filter:none}.nav button.focused{outline:2px solid #9aeee3;outline-offset:-3px}.nav button.hovered{background:#315766;border-color:#84b4b6}.nav button.disabled{color:#809396;border-color:transparent}.nav button.disabled img{opacity:.35}.callout{width:784px;margin-top:10px;padding:16px;border:1px solid #65969b;background:#173846;border-radius:5px;font-size:16px;line-height:1.75;overflow-wrap:anywhere;color:#f0e6cd}.callout strong{display:block;font-size:18px;color:#efeddc;margin-bottom:8px}.walletrow{border-top:1px solid #355965;padding:7px 0;font-size:16px;line-height:1.6}.ruler{margin-top:6px;font-size:13px;color:#7eabad;display:flex;justify-content:space-between;width:808px}.caption{font-size:14px;color:#94b8b8;margin-top:8px;line-height:1.65}.metrics{margin-top:24px;padding:16px;background:#122d3a;border-left:3px solid #83cfcb;font-size:15px;line-height:1.8;white-space:pre-wrap}button{cursor:default}
</style><body><h1>H2 顶部梁 · 1:1 字体与状态排布</h1><p>仅为宿主设计证据；808×65 CSS像素、DPR=1、缩放100%。使用仓库 Noto Sans SC，字重450、正文16px。浏览器字形度量不替代Godot实机验收。</p><div id="cases"></div><div class="metrics" id="metrics"></div>
<script>
const iconBase='../../../assets/ui/shell/';
const nav=[['装备',80,'equipment'],['反应炉',96,'reactor'],['科研',80,'research'],['强化',80,'enhancement'],['船员',80,'crew'],['星球',80,'planet'],['星系',80,'galaxy'],['超空间',96,'hyperspace'],['更多',80,null]];
const specs=[
 {id:'normal',label:'01 / 普通余额与已保存',values:['铁：45','铀：1,976','时空微粒：8,147'],save:'已保存',note:'原808宽保持。首行32px；次行33px。导航按钮30px高、正文16px；反应炉唯一选中。'},
 {id:'large',label:'02 / 有限指数的大金额',values:['铁：1.235×10^123','铀：9.999×10^999','时空微粒：1.235×10^123'],save:'待写入',note:'样例采用PlayerText.number既有输出形态；只做文字布局，不自行计算Amount。数量级与资源名必须完整保留。'},
 {id:'extreme',label:'03 / 无界长指数：完整值详情',values:['铁：1.234567890123456789×10^123456789012345678901234567890','铀：9.999×10^12345678901234567890','时空微粒：1.235×10^12345678901234567890'],save:'已保存',wallet:true,note:'不能以截尾省略号吃掉指数。超出格宽时明确显示“铁：完整值 ▸”等入口；打开详情保留原字符串、换行显示全部值。此极值策略仍待产品/视觉评审，不冒充顶栏可完整容纳任意数。'},
 {id:'failure',label:'04 / 保存失败与完整错误',values:['铁：45','铀：1,976','时空微粒：8,147'],save:'保存失败',error:true,detail:true,note:'短状态只报告失败；点击/聚焦可展开完整故障。不能把排队显示成已保存，不以短格裁切替代必要错误。'},
 {id:'focus',label:'05 / 已选、焦点、悬停和未开放示意',values:['铁：45','铀：1,976','时空微粒：8,147'],save:'有改动',states:true,note:'已选=象牙底；键盘焦点=青色实线；悬停=蓝色提亮。灰项仅为字形/状态研究，实际隐藏/禁用必须遵守各模块公开规则。'}
];
for(const c of specs){const row=document.createElement('section');row.className='case';row.dataset.case=c.id;row.innerHTML=`<div><div class="label">${c.label}</div><div class="bar"><div class="resources"><div class="brand">远航舰桥</div>${c.values.map((v,i)=>`<div class="money" data-full="${v}" title="${v}"><span class="amount">${v}</span><span class="fallback">${['铁','铀','微粒'][i]}：完整值 ▸</span></div>`).join('')}<button class="fullwallet" title="全部资源与完整金额">⋯</button><div class="save ${c.error?'error':''}">${c.save}</div></div><div class="nav">${nav.map((n,i)=>`<button style="width:${n[1]}px" class="${i===1?'selected':''} ${c.states&&i===1?'focused':''} ${c.states&&i===2?'hovered':''} ${c.states&&i===6?'disabled':''}">${n[2]?`<img src="${iconBase+n[2]}.svg" alt="">`:''}<span>${n[0]}</span></button>`).join('')}</div></div><div class="ruler"><span>0</span><span>808px / 高65px</span><span>808</span></div>${c.wallet?`<div class="callout"><strong>全部资源 · 完整金额</strong>${[...c.values,'强化碎片：1.235×10^123'].map(v=>`<div class="walletrow">${v}</div>`).join('')}</div>`:''}${c.detail?`<div class="callout"><strong>保存失败</strong>当前进度尚未写入文件：无法写入所选目录。请在“更多 → 设置与保存”查看真实状态并重试。<br>本段是设计故障样例；实际原因必须由现有SaveFiles结果提供。</div>`:''}</div><div class="aside">${c.note}</div>`;document.getElementById('cases').append(row)}
window.measure=async()=>{await document.fonts.ready;const cv=document.createElement('canvas'),ctx=cv.getContext('2d');ctx.font='450 16px ShipSC';const ink=ctx.measureText('装备反应炉时空微粒1.235×10^123');const result={ink:{ascent:ink.actualBoundingBoxAscent,descent:ink.actualBoundingBoxDescent,total:ink.actualBoundingBoxAscent+ink.actualBoundingBoxDescent,resourceLineHeight:24,navLineHeight:22},kind:'design-font-layout-only',font:'NotoSansSC.ttf',fontWeight:450,fontSize:16,devicePixelRatio:devicePixelRatio,viewport:[innerWidth,innerHeight],cases:[]};for(const row of document.querySelectorAll('.case')){const bar=row.querySelector('.bar'),r=bar.getBoundingClientRect();const data={id:row.dataset.case,bar:{width:r.width,height:r.height},money:[],nav:[]};for(const money of row.querySelectorAll('.money')){const amount=money.querySelector('.amount');const available=money.clientWidth-7;const natural=amount.getBoundingClientRect().width;const overflow=natural>available;money.classList.toggle('overflow',overflow);data.money.push({text:money.dataset.full,cell:money.clientWidth,available,natural,overflow,display:overflow?money.querySelector('.fallback').textContent:money.dataset.full})}for(const button of row.querySelectorAll('.nav button')){const br=button.getBoundingClientRect(),sp=button.querySelector('span').getBoundingClientRect();data.nav.push({name:button.textContent,width:br.width,height:br.height,textWidth:sp.width,fontSize:getComputedStyle(button).fontSize,scrollWidth:button.scrollWidth,clientWidth:button.clientWidth,overflow:button.scrollWidth>button.clientWidth})}result.cases.push(data)}window.measurement=result;document.getElementById('metrics').textContent='测量说明：所有数值是设计字符串，不是运行钱包或保存状态。\n'+result.cases.map(c=>`${c.id}：${c.bar.width}×${c.bar.height}；金额格溢出 ${c.money.filter(v=>v.overflow).length}/3；导航溢出 ${c.nav.filter(v=>v.overflow).length}/9`).join('\n');return result};window.ready=window.measure();
</script></body></html>
