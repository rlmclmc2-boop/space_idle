<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>C 风格公共壳 · 精确边界预览</title>
<style>
:root{color-scheme:dark;font-family:'Noto Sans CJK SC','Noto Sans SC',sans-serif;background:#071723;color:#e9efe7}
*{box-sizing:border-box}body{margin:0;min-width:1480px;background:radial-gradient(circle at 50% 5%,#163447,#071723 65%);}
main{width:1440px;margin:18px auto 0}.stage{position:relative;width:1440px;height:900px;overflow:hidden;background:#061a29;box-shadow:0 22px 80px #020b12,0 0 0 1px #668487}
.stage>img{position:absolute;inset:0;width:1440px;height:900px;object-fit:fill;pointer-events:none}
/* Public material only. The source screen remains a separate, unmodified IMG. */
.top{position:absolute;left:0;top:0;width:808px;height:65px;z-index:4;background:linear-gradient(180deg,#314a55 0,#142b3a 12%,#102c3d 74%,#0a2433 100%);border-bottom:2px solid #bcae8d;box-shadow:inset 0 2px #73848b;display:grid;grid-template-columns:108px 162px 162px 206px 32px 88px;align-content:center;gap:6px;padding:0 10px}
.top:before{content:"";position:absolute;top:2px;left:8px;right:8px;height:2px;background:linear-gradient(90deg,#bcb6a1,#6caeae 38%,#354f5d 74%,#d3bf96)}
.brand{height:48px;display:grid;place-items:center;color:#173847;font-weight:700;letter-spacing:.05em;background:linear-gradient(145deg,#fff7df,#b7c4ba);clip-path:polygon(0 12%,8% 0,92% 0,100% 12%,100% 88%,92% 100%,8% 100%,0 88%);text-shadow:0 1px #fff9}
.readout{height:42px;align-self:center;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid #5b8082;background:linear-gradient(155deg,#284655,#0b2838 60%,#173749);clip-path:polygon(0 6px,6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);color:#c6dcd5;font-size:13px;white-space:nowrap;box-shadow:inset 0 1px #90aaa766}.readout b{color:#f1e7d0;font-size:16px;letter-spacing:.01em}
.readout i{display:inline-block;width:9px;height:9px;background:#64d4d9;transform:rotate(45deg);box-shadow:0 0 8px #5be5e5}
.status{align-self:center;height:26px;border:1px solid #71959b;background:#143c4c;border-radius:5px;display:grid;place-items:center;color:#b5efe4}
.resource{align-self:center;height:31px;border:1px solid #879f9e;border-radius:5px;background:linear-gradient(145deg,#284f60,#143545);color:#eaf0df;font-size:14px;box-shadow:inset 0 1px #91b4af,0 2px #0b1c25}
.nav{position:absolute;z-index:5;left:808px;top:0;width:47.875px;height:900px;background:linear-gradient(90deg,#50626a 0,#0b2534 10%,#17394c 48%,#061b2a 92%,#9c8f74 100%);border-right:1px solid #b8a577;border-left:1px solid #8aa5a0;box-shadow:inset 4px 0 #e0d5b077}
.nav:before,.nav:after{content:"";position:absolute;left:19px;width:8px;height:45px;border-radius:4px;background:linear-gradient(#e2b775,#79592d);box-shadow:0 0 12px #efb46c}.nav:before{top:9px}.nav:after{bottom:9px}
.keys{position:absolute;top:58px;bottom:58px;left:2px;right:2px;display:flex;flex-direction:column;justify-content:space-between}
.key{position:relative;height:74px;border:1px solid #678e91;border-radius:5px;background:linear-gradient(145deg,#204559,#0b2939);color:#a3e7e5;font-size:23px;font-weight:700;cursor:pointer;box-shadow:inset 0 1px #87a4a35e,0 2px 3px #061a23}
.key:before{content:"";position:absolute;left:4px;right:4px;top:3px;height:1px;background:linear-gradient(90deg,transparent,#b6dbd080,transparent)}
.key svg{display:block;width:27px;height:27px;margin:auto;filter:drop-shadow(0 0 3px #4cc9d180)}
.key:hover,.key:focus-visible{outline:1px solid #a4e8e2;box-shadow:inset 0 1px #b3e5e1,inset 0 0 9px #41c4d277}
.key.on{background:linear-gradient(145deg,#fff8df,#a9c1bb);color:#1b4d5d;border-color:#ffdfa1;box-shadow:inset 0 1px #fff9e8,inset 0 0 9px #e2c28b8c}
.outer{position:absolute;z-index:2;left:1392.125px;top:0;width:47.875px;height:900px;border-left:1px solid #81a3a6;background:radial-gradient(circle at 25% 17%,#5a9cbc 0 1px,transparent 2px),radial-gradient(circle at 74% 48%,#b4d6da 0 1px,transparent 2px),radial-gradient(circle at 61% 69%,#78acc6 0 1px,transparent 2px),linear-gradient(90deg,#173a55,#0b2841 58%,#102c42);box-shadow:inset 3px 0 #a7c1b344}
.outer:after{content:"";position:absolute;right:5px;top:0;bottom:0;width:2px;background:linear-gradient(#c1a576,#3a7283 35%,#6c9092 70%,#c1a576);opacity:.72}
.toolbar{display:flex;gap:12px;align-items:center;padding:18px 2px 25px;color:#c5d4d2}.toolbar button{background:#183b4d;color:#e8efe8;border:1px solid #78979a;border-radius:5px;padding:8px 16px;cursor:pointer;font-size:15px}.toolbar button.sel{background:#e8e1c9;color:#194255;border-color:#f3d99d}.toolbar small{margin-left:auto;color:#9fb8b8}
</style>
<main>
<div class="stage" id="stage">
<img id="source" src="../../runtime-h1/equipment-623-integration/evidence/equipment-normal.png" width="1440" height="900" alt="未修改的共享实机整屏">
<div class="top"><div class="brand" id="context">装备</div><div class="readout"><i></i>铁 <b id="iron">10万</b></div><div class="readout"><i></i>铀 <b id="uranium">1,000</b></div><div class="readout"><i></i>时空微粒 <b id="chrono">86</b></div><div class="status" title="保存与会话状态">•</div><button class="resource">资源</button></div>
<div class="nav"><div class="keys" id="keys"></div></div><div class="outer" aria-hidden="true"></div>
</div>
<div class="toolbar"><button data-route="equipment" class="sel">装备实机</button><button data-route="reactor">反应堆 R1 实机</button><button data-route="planet">星球 R14 实机</button><small>1440×900 原图不变 · 中轴 47.875px 仅占战场左侧原黑带 · 导航位置仍未定</small></div>
</main>
<script>
const routes={
equipment:{url:'../../runtime-h1/equipment-623-integration/evidence/equipment-normal.png',context:'装备',iron:'10万',uranium:'1,000',chrono:'86'},
reactor:{url:'../../runtime-h1/reactor-direct-r1-integration/evidence/four-running.png',context:'反应炉',iron:'0',uranium:'1,000',chrono:'0'},
planet:{url:'../../runtime-h1/planet-r14-integration/evidence/planet-r14-t0.png',context:'星球',iron:'48',uranium:'0',chrono:'7,332'}};
const shapes={equipment:'M12 2 L17 11 L21 21 L14 18 L12 24 L10 18 L3 21 L7 11 Z M9 13 L15 13',reactor:'M12 3 C17 3 17 21 12 21 C7 21 7 3 12 3 M3 12 C3 7 21 7 21 12 C21 17 3 17 3 12 M5 5 L19 19 M19 5 L5 19',research:'M9 2 H15 M10 2 V9 L4 20 Q4 22 7 22 H17 Q20 22 20 20 L14 9 V2 M7 17 H17',enhancement:'M12 2 L17 9 L22 12 L17 15 L12 22 L7 15 L2 12 L7 9 Z M12 6 V18 M6 12 H18',crew:'M8 10 A3 3 0 1 0 8 4 A3 3 0 0 0 8 10 M17 10 A3 3 0 1 0 17 4 A3 3 0 0 0 17 10 M2 20 V17 Q2 13 8 13 Q14 13 14 17 V20 M12 20 V17 Q12 13 17 13 Q22 13 22 17 V20',planet:'M12 4 A8 8 0 1 0 12 20 A8 8 0 1 0 12 4 M2 16 Q10 10 22 8 M4 7 Q13 14 21 17',galaxy:'M12 12 Q3 7 4 16 Q7 22 14 20 Q21 19 20 12 Q19 5 12 4 Q5 3 3 9 M12 12 Q18 8 20 12 M12 12 Q8 16 11 20',hyperspace:'M3 4 L10 12 L3 20 M21 4 L14 12 L21 20 M11 4 V20 M13 4 V20',more:'M5 12 H5.1 M12 12 H12.1 M19 12 H19.1'};
const items=[['equipment','装备'],['reactor','反应炉'],['research','科研'],['enhancement','强化'],['crew','船员'],['planet','星球'],['galaxy','星系'],['hyperspace','超空间'],['more','更多']];
let active='equipment';
function render(){const r=routes[active];document.querySelector('#source').src=r.url;for(const k of ['context','iron','uranium','chrono'])document.getElementById(k).textContent=r[k];document.querySelectorAll('.toolbar button').forEach(b=>b.classList.toggle('sel',b.dataset.route===active));document.querySelector('#keys').innerHTML='';for(const [key,label] of items){const b=document.createElement('button');b.className='key'+(key===active?' on':'');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+shapes[key]+'"/></svg>';b.title=label;b.setAttribute('aria-label',label);if(routes[key])b.onclick=()=>{active=key;render()};document.querySelector('#keys').append(b)}}
document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{active=b.dataset.route;render()});render();
</script>
</html>
