<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G1 · 完整方向内部构造</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="reviewbar"><span>G1 内部待审 · 模拟状态 · 不是完整候选或游戏验证</span><div><button data-family="scene">A · 机舱现场</button><button data-family="work">B · 作业编排</button><button id="scenario-open">情境检查</button></div></div>
<header><div class="brand"><i>◈</i><div>远航舰桥<small>FAR HORIZON / OPERATIONS</small></div></div><div class="wallet"><span>铁 <b id="iron">128.6 M</b></span><span>铀 <b>8.4 M</b></span><span>碎片 <b>2.1 K</b></span></div><div class="header-right"><span class="live">航行中</span><button id="pause">Ⅱ 暂停</button><button id="collapse">收起工作区</button></div></header>
<main>
<section id="workspace"><nav id="nav"></nav><div id="work-content"></div></section>
<aside id="battle"><div class="battle-title"><div><span class="eyebrow">LIVE THEATER</span><b>第 12 星域 · 巡航</b></div><span class="pill">驻守关闭</span></div><div id="field-host"><div id="world"><div class="orbit-line"></div><img class="enemy e1" src="../../../assets/ui/ships/fleet_20261019/01-frigate.png" alt="敌舰位置演示"><img class="enemy e2" src="../../../assets/ui/ships/fleet_20261019/02-destroyer.png" alt="敌舰位置演示"><div class="beam"></div><img class="player" src="../../../assets/ui/ships/fleet_20261019/03-cruiser.png" alt="巡洋舰静态预览代位"><div class="pickup"></div></div><div class="world-label enemy-label">敌舰 · 68%</div><div class="world-label drop-label">铁 +12.4 K</div></div><div class="battle-bottom"><span>护盾 <b>84%</b></span><span>装甲 <b>100%</b></span><span class="safe">航程持续推进</span></div></aside>
</main>
<footer><span id="notice">舰桥就绪</span><span id="geometry">显示预算</span></footer>
<dialog id="scenario"><h2>内部情境检查</h2><p>切换演示状态，不代表领域命令或真实结算。两方向共享同一状态，以便比较组织和连续操作。</p><label>反应炉 <select id="reactor-case"><option value="running">供能中</option><option value="idle">无负载</option><option value="draft">分配草稿未应用</option><option value="rejected">额度不足</option><option value="opened">凝聚已开放</option></select></label><label>换装 <select id="equipment-case"><option value="normal">当前装备</option><option value="compare">比较候选</option><option value="cooldown">冷却中</option><option value="poor">余额不足</option></select></label><label>星球 <select id="planet-case"><option value="building">施工中</option><option value="paused">缺人暂停</option><option value="ready">待领取</option><option value="owned">已领取</option></select></label><label>星系 <select id="galaxy-case"><option value="building">建设中</option><option value="fog">未探索</option><option value="planned">规划地基</option><option value="upgrading">升级中</option><option value="complete">建成</option></select></label><button id="scenario-close" class="primary">返回工作区</button></dialog>
<script src="app.js"></script></body></html>
