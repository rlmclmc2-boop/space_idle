<dialog id="scenario"><h2>内部情境检查</h2><div class="inspection-note">G1组织审通过，G2未完成。数值、人物、任务和结果均为可追踪演示快照，未接GameSession；这里记录实现边界，不在普通页面占位。反应炉与科研比例为可操作草稿意图，真实Amount预览仍待接入。其他未深化工作点见设计说明，不记为完整前端。<br><small id="geometry"></small></div><p>切换演示状态，不代表领域命令或真实结算。两方向共享同一状态，以便比较组织和连续操作。</p><label>反应炉 <select id="reactor-case"><option value="running">供能中</option><option value="idle">无负载</option><option value="draft">分配草稿未应用</option><option value="rejected">额度不足</option><option value="opened">凝聚已开放</option></select></label><label>科研状态 <select id="research-case"><option value="running">研究中</option><option value="paused">暂停</option><option value="unfunded">投入资金不足，基础研究继续</option><option value="completed">本级完成</option></select></label><label>研究开放 <select id="research-unlocks"><option value="base">前置满足的六项</option><option value="all">全部前置已满足</option></select></label><label>手动任务 <select id="manual-task-case"><option value="idle">待命</option><option value="running">进行中</option><option value="ready">完成边界</option><option value="failed">失败边界</option></select></label><label>在线任务 <select id="online-task-case"><option value="idle">待命</option><option value="running">进行中</option><option value="ready">完成边界</option><option value="failed">失败边界</option></select></label><label>引导情境 <select id="guide-case"><option value="review">主动回看</option><option value="first">首次引导暂停</option></select></label><label>保存情境 <select id="save-case"><option value="saved">最近已写入</option><option value="dirty">有未保存进度</option><option value="queued">排队</option><option value="writing">写入中</option><option value="failed">写入失败</option><option value="recovery">恢复暂停</option></select></label><label>任务仓位样本<select id="task-full-case"><option value="current">当前仓位</option><option value="full">主仓200 + 溢出10满仓</option></select></label><label>完成奖励样本<select id="task-reward-case"><option value="drone">无人机 + 路线材料</option><option value="core">究极核心 + 路线材料</option><option value="filtered">过滤拆解（载入蓝色拆解策略）</option></select></label><label>仓储浏览样本<select id="warehouse-density-case"><option value="base">基本7架</option><option value="full">满仓200（重载恢复基本样本）</option></select></label><label>改造材料样本<select id="forge-funds-case"><option value="current">当前余额</option><option value="enough">充足材料/3核心（受控样本）</option></select></label><label>强化报价资金 <select id="enhance-funds"><option value="poor">2.1 K · 不足</option><option value="enough">64.0 B · 允许部分购级示例</option></select></label><label>批量预算响应<select id="m2-batch-case"><option value="current">当前预算</option><option value="limited">连续样本：+1 / +10 / MAX，材料10</option><option value="failure">已接纳两槽后后段报价失败</option></select></label><label>舰体开放响应<select id="m2-ships-case"><option value="base">白鲸未开放</option><option value="all">五舰均已开放</option></select></label><label>换装 <select id="equipment-case"><option value="normal">当前装备</option><option value="compare">比较候选</option><option value="cooldown">冷却中</option><option value="poor">余额不足</option></select></label><label>星球 <select id="planet-case"><option value="building">施工中</option><option value="paused">缺人暂停</option><option value="ready">待领取</option><option value="owned">已领取</option></select></label><label>星系 <select id="galaxy-case"><option value="building">建设中</option><option value="fog">未探索</option><option value="planned">规划地基</option><option value="upgrading">升级中</option><option value="complete">建成</option></select></label><button id="scenario-close" class="primary">返回工作区</button></dialog>
